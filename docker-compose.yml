version: '3.8'

services:
  admin:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
